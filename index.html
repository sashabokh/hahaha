<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TERMINAL_SELECTION</title>
    <style>
        :root { --neon: #ff00ff; --cyan: #00ffff; --bg: #0a000a; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; height: 100vh; display: flex; justify-content: center; 
            align-items: center; background-color: var(--bg); 
            font-family: 'Courier New', monospace; overflow: hidden; color: white; 
        }

        .container { 
            width: 95%; max-width: 450px; text-align: center; z-index: 10; 
            background: rgba(0, 0, 0, 0.95); padding: 20px; 
            border: 1px solid var(--neon); box-shadow: 0 0 20px var(--neon); 
        }

        h1 { font-size: 16px; letter-spacing: 2px; text-shadow: 2px 2px var(--neon); text-transform: uppercase; margin-bottom: 20px; }

        /* Сетка для карточек выбора */
        .selection-grid { 
            display: flex; gap: 15px; margin-bottom: 10px; 
        }

        .choice-card {
            flex: 1; border: 1px solid #333; padding: 10px; cursor: pointer;
            transition: 0.3s; position: relative; overflow: hidden;
        }

        .choice-card img {
            width: 100%; height: 150px; object-fit: cover; 
            filter: grayscale(0.8); transition: 0.3s;
        }

        .choice-label {
            margin-top: 10px; font-weight: bold; font-size: 12px; letter-spacing: 1px;
        }

        /* Эффекты при наведении/активации */
        #yesCard:hover { border-color: var(--cyan); box-shadow: 0 0 15px var(--cyan); }
        #yesCard:hover img { filter: grayscale(0); }
        #yesCard:hover .choice-label { color: var(--cyan); }

        #noCard:hover { border-color: #ff0000; box-shadow: 0 0 15px #ff0000; }
        #noCard:hover .choice-label { color: #ff0000; }

        .hidden { display: none; }
        
        #timer { 
            font-size: 1.2rem; color: var(--cyan); margin: 20px 0; 
            border: 1px dashed var(--cyan); padding: 15px; 
            text-shadow: 0 0 10px var(--cyan);
        }

        .glitch-item { position: fixed; color: var(--neon); pointer-events: none; z-index: 1; font-weight: bold; }
    </style>
</head>
<body>

    <audio id="noMusic" loop><source src="no_music.mp3" type="audio/mpeg"></audio>
    <audio id="yesMusic" loop><source src="yes_music.mp3" type="audio/mpeg"></audio>

    <!-- ГЛАВНЫЙ ЭКРАН ВЫБОРА -->
    <div class="container" id="mainSection">
        <h1>INITIALIZING_PROPOSAL...</h1>
        
        <div class="selection-grid">
            <!-- КАРТОЧКА ДА -->
            <div class="choice-card" id="yesCard" onclick="selectYes()">
                <img src="yes_photo.jpg" alt="YES">
                <div class="choice-label">EXECUTE_YES.exe</div>
            </div>

            <!-- КАРТОЧКА НЕТ -->
            <div class="choice-card" id="noCard" onclick="selectNo()">
                <img src="no_photo.jpg" alt="NO">
                <div class="choice-label">REJECT_VOID.bin</div>
            </div>
        </div>
        
        <p style="font-size: 12px; color: var(--neon); margin-top: 15px;">будешь моей тянкой?</p>
    </div>

    <!-- ЭКРАН УСПЕХА -->
    <div class="container hidden" id="happySection">
        <img src="yes_photo.jpg" style="width: 100%; height: 250px; object-fit: cover; border: 1px solid var(--cyan);" alt="Success">
        <h1 style="color: var(--cyan); text-shadow: 0 0 10px var(--cyan); margin-top: 20px;">CONNECTION_STABLE</h1>
        <div id="timer">INITIALIZING...</div>
        <p style="font-size: 10px; color: #444; letter-spacing: 2px;">вот столько мы сидим вместе в фудкорте</p>
    </div>

    <script>
        const startDate = new Date(2024, 9, 6); // Установил 2024 год, чтобы таймер уже шел
        const noMusic = document.getElementById('noMusic');
        const yesMusic = document.getElementById('yesMusic');
        const main = document.getElementById('mainSection');
        const happy = document.getElementById('happySection');

        function selectNo() {
            yesMusic.pause();
            noMusic.currentTime = 48; 
            noMusic.play().catch(() => {});
            
            const label = document.querySelector('#noCard .choice-label');
            label.innerText = 'ERROR_FATAL';
            document.getElementById('noCard').style.borderColor = 'red';
        }

        function selectYes() {
            noMusic.pause();
            yesMusic.currentTime = 32; 
            yesMusic.play().catch(() => {});
            
            main.classList.add('hidden');
            happy.classList.remove('hidden');
            
            setInterval(updateTimer, 1000);
            setInterval(createGlitchHeart, 150);
        }

        function updateTimer() {
            const diff = new Date() - startDate;
            const d = Math.floor(diff / 86400000);
            const h = Math.floor((diff / 3600000) % 24);
            const m = Math.floor((diff / 60000) % 60);
            const s = Math.floor((diff / 1000) % 60);
            document.getElementById('timer').innerText = `${d}D:${h}H:${m}M:${s}S`;
        }

        function createGlitchHeart() {
            const el = document.createElement('div');
            el.className = 'glitch-item';
            el.innerText = Math.random() > 0.3 ? '❤' : '✖';
            el.style.left = Math.random() * 100 + 'vw';
            el.style.top = '-5vh';
            el.style.fontSize = Math.random() * 20 + 10 + 'px';
            el.style.transition = 'transform 3s linear, opacity 3s';
            document.body.appendChild(el);
            setTimeout(() => {
                el.style.transform = `translateY(110vh) rotate(${Math.random() * 360}deg)`;
                el.style.opacity = '0';
            }, 100);
            setTimeout(() => el.remove(), 4000);
        }
    </script>
</body>
</html>
