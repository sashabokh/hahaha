<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TERMINAL_CONNECTION_JVNE</title>
    <style>
        :root { --neon: #ff00ff; --cyan: #00ffff; --bg: #0a000a; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; height: 100vh; display: flex; justify-content: center;
            align-items: center; background-color: var(--bg);
            font-family: 'Courier New', monospace; overflow: hidden; color: white;
        }

        /* Эффект шума/глитча на фоне */
        body::after {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://media.giphy.com');
            opacity: 0.08; pointer-events: none; z-index: 100;
        }

        .container {
            width: 90%; max-width: 400px; text-align: center; z-index: 10;
            background: rgba(0, 0, 0, 0.85); padding: 20px;
            border: 1px solid var(--neon); box-shadow: 0 0 20px var(--neon);
        }

        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        
        .option-card {
            border: 1px solid #333; padding: 5px; transition: 0.3s;
            cursor: pointer; background: #111;
        }
        
        .option-card img { 
            width: 100%; height: 130px; object-fit: cover; 
            filter: grayscale(1) contrast(1.2); transition: 0.3s;
        }
        
        .option-card:hover { border-color: var(--neon); box-shadow: 0 0 10px var(--neon); }
        .option-card:hover img { filter: grayscale(0) sepia(1) hue-rotate(270deg); }

        h1 { font-size: 18px; letter-spacing: 2px; text-shadow: 2px 2px var(--neon); text-transform: uppercase; }

        .btn {
            margin-top: 10px; padding: 10px; width: 100%;
            background: transparent; border: 1px solid var(--neon);
            color: var(--neon); font-family: inherit; font-weight: bold; cursor: pointer;
        }

        #noBtn { position: relative; border-color: #555; color: #555; z-index: 101; }

        .hidden { display: none; }
        
        /* Экран успеха */
        #timer { font-size: 1.1rem; color: var(--cyan); margin: 20px 0; text-shadow: 0 0 8px var(--cyan); border: 1px dashed var(--cyan); padding: 10px; }
        .glitch-item { position: fixed; color: var(--neon); pointer-events: none; z-index: 1; font-weight: bold; }
        
        .final-gif { width: 100%; border: 1px solid var(--cyan); filter: hue-rotate(280deg) saturate(1.5); }
    </style>
</head>
<body>

    <audio id="bgMusic" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- Основной выбор -->
    <div class="container" id="mainSection">
        <h1>SYNC_WITH_ME?</h1>
        
        <div class="options">
            <!-- КАРТОЧКА ДА -->
            <div class="option-card" onclick="selectYes()">
                <img src="yes.jpg" alt="Yes">
                <button class="btn">ACCEPT</button>
            </div>
            
            <!-- КАРТОЧКА НЕТ -->
            <div class="option-card" id="noCard">
                <img src="no.jpg" alt="No" style="filter: brightness(0.3) grayscale(1);">
                <button class="btn" id="noBtn">REJECT</button>
            </div>
        </div>
    </div>

    <!-- Финальный экран -->
    <div class="container hidden" id="happySection">
        <img src="final.jpg" class="final-gif" alt="Success">
        <h1 style="color: var(--cyan); text-shadow: 0 0 10px var(--cyan); margin-top: 15px;">CONNECTION_STABLE</h1>
        <div id="timer">SYNCHRONIZING...</div>
        <p style="font-size: 10px; color: #555; margin-top: 10px;">WE_HAD_GOOD_TIMES_TOGETHER.EXE</p>
    </div>

    <script>
        const startDate = new Date(2024, 0, 1); // Твоя дата (Год, месяц-1, день)
        const noBtn = document.getElementById('noBtn');

        // Убегающая кнопка НЕТ
        const moveNo = (e) => {
            if(e) e.preventDefault();
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 20);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 20);
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
            noBtn.innerText = 'VOID_ERR';
        };

        noBtn.addEventListener('mouseover', moveNo);
        noBtn.addEventListener('touchstart', moveNo);

        // Кнопка ДА
        function selectYes() {
            document.getElementById('bgMusic').play().catch(() => {});
            document.getElementById('mainSection').classList.add('hidden');
            document.getElementById('happySection').classList.remove('hidden');
            setInterval(updateTimer, 1000);
            setInterval(createGlitchEffect, 150);
        }

        function updateTimer() {
            const diff = new Date() - startDate;
            const d = Math.floor(diff / 86400000);
            const h = Math.floor((diff / 3600000) % 24);
            const m = Math.floor((diff / 60000) % 60);
            const s = Math.floor((diff / 1000) % 60);
            document.getElementById('timer').innerText = `${d}D:${h}H:${m}M:${s}S`;
        }

        function createGlitchEffect() {
            const el = document.createElement('div');
            el.className = 'glitch-item';
            el.innerText = Math.random() > 0.5 ? '✖' : '❤';
            el.style.left = Math.random() * 100 + 'vw';
            el.style.top = Math.random() * 100 + 'vh';
            el.style.opacity = Math.random();
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 600);
        }
    </script>
</body>
</html>
