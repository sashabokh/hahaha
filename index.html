<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TERMINAL_STABLE_V3</title>
    <style>
        :root { --neon: #ff00ff; --cyan: #00ffff; --bg: #0a000a; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; min-height: 100vh; display: flex; justify-content: center; 
            align-items: center; background-color: var(--bg); 
            font-family: 'Courier New', monospace; overflow: hidden; color: white; 
        }

        .container { 
            width: 95%; max-width: 500px; text-align: center; z-index: 10; 
            background: rgba(0, 0, 0, 0.95); padding: 25px; 
            border: 1px solid var(--neon); box-shadow: 0 0 20px var(--neon); 
        }

        h1 { font-size: 16px; letter-spacing: 2px; text-shadow: 2px 2px var(--neon); text-transform: uppercase; margin-bottom: 25px; }

        /* Сетка выбора */
        .selection-grid { display: flex; gap: 15px; margin-bottom: 20px; }

        .choice-item { 
            flex: 1; border: 1px solid #333; padding: 10px; cursor: pointer;
            transition: all 0.3s ease; display: flex; flex-direction: column; align-items: center;
        }

        .choice-img { 
            width: 100%; height: 160px; object-fit: cover; 
            border: 1px solid #222; margin-bottom: 10px; transition: 0.3s;
        }

        /* Наведение на кнопки */
        #yesChoice:hover { border-color: var(--cyan); box-shadow: 0 0 15px var(--cyan); transform: scale(1.02); }
        #yesChoice:hover .choice-img { border-color: var(--cyan); filter: brightness(1.2); }
        
        #noChoice:hover { border-color: #ff0000; box-shadow: 0 0 15px #ff0000; transform: scale(0.98); }
        #noChoice:hover .choice-img { filter: grayscale(1) contrast(1.5); }

        .btn-label { font-weight: bold; font-size: 11px; letter-spacing: 1px; color: #888; text-transform: uppercase; }

        .hidden { display: none; }
        
        /* Финальный экран */
        #timer { 
            font-size: 1.2rem; color: var(--cyan); margin: 20px 0; 
            border: 1px dashed var(--cyan); padding: 15px; 
            text-shadow: 0 0 10px var(--cyan); background: rgba(0, 255, 255, 0.05);
        }

        .glitch-item { position: fixed; color: var(--neon); pointer-events: none; z-index: 1; font-weight: bold; }
    </style>
</head>
<body>

    <audio id="noMusic" loop><source src="no_music.mp3" type="audio/mpeg"></audio>
    <audio id="yesMusic" loop><source src="yes_music.mp3" type="audio/mpeg"></audio>

    <!-- ГЛАВНЫЙ ЭКРАН -->
    <div class="container" id="mainSection">
        <h1>будешь моей тянкой?</h1>
        <div class="selection-grid">
            <div class="choice-item" id="yesChoice" onclick="selectYes()">
                <img src="start_yes.jpg" alt="YES" class="choice-img">
                <div class="btn-label">[ да ]</div>
            </div>
            <div class="choice-item" id="noChoice" onclick="selectNo()">
                <img src="start_no.jpg" alt="NO" class="choice-img">
                <div class="btn-label">[ стерва ]</div>
            </div>
        </div>
    </div>

    <!-- ЭКРАН УСПЕХА -->
    <div class="container hidden" id="happySection">
        <!-- СЮДА ВСТАВЛЯЕМ ФИНАЛЬНУЮ КАРТИНКУ -->
        <img src="final_photo.jpg" id="finalImg" style="width: 100%; height: 300px; object-fit: cover; border: 1px solid var(--cyan);" alt="SUCCESS">
        <h1 style="color: var(--cyan); text-shadow: 0 0 10px var(--cyan); margin-top: 20px;">CONNECTION_ESTABLE</h1>
        <div id="timer">00D:00H:00M:00S</div>
        <p style="font-size: 10px; color: #666; letter-spacing: 2px;">МЫ ВМЕСТЕ В ФУДКОРТЕ</p>
    </div>

    <script>
        const startDate = new Date(2024, 9, 6); // Твоя дата (октябрь = 9)

        function selectNo() {
            document.getElementById('yesMusic').pause();
            const noMusic = document.getElementById('noMusic');
            noMusic.currentTime = 0; 
            noMusic.play().catch(() => {});
            
            document.querySelector('#noChoice .btn-label').innerText = 'ERROR_FATAL';
            document.getElementById('noChoice').style.borderColor = 'red';
        }

        function selectYes() {
            document.getElementById('noMusic').pause();
            const yesMusic = document.getElementById('yesMusic');
            yesMusic.currentTime = 0; 
            yesMusic.play().catch(() => {});
            
            document.getElementById('mainSection').classList.add('hidden');
            document.getElementById('happySection').classList.remove('hidden');
            
            setInterval(updateTimer, 1000);
            setInterval(createGlitchHeart, 150);
        }

        function updateTimer() {
            const diff = new Date() - startDate;
            const d = Math.floor(diff / 86400000);
            const h = Math.floor((diff / 3600000) % 24);
            const m = Math.floor((diff / 60000) % 60);
            const s = Math.floor((diff / 1000) % 60);
            document.getElementById('timer').innerText = `${d}D:${h}H:${m}M:${s}S`;
        }

        function createGlitchHeart() {
            const el = document.createElement('div');
            el.className = 'glitch-item';
            el.innerText = Math.random() > 0.3 ? '❤' : '✖';
            el.style.left = Math.random() * 100 + 'vw';
            el.style.top = '-5vh';
            el.style.fontSize = Math.random() * 20 + 10 + 'px';
            el.style.transition = 'transform 3s linear, opacity 3s';
            document.body.appendChild(el);
            setTimeout(() => {
                el.style.transform = `translateY(110vh) rotate(${Math.random() * 360}deg)`;
                el.style.opacity = '0';
            }, 100);
            setTimeout(() => el.remove(), 4000);
        }
    </script>
</body>
</html>
